name: Daily Automated LinkedIn & Twitter Post

on:
  schedule:
    # Runs daily at 03:30 UTC (9:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Fetch Latest Technical News Feeds
        run: uv run python fetch_ai_news_rss.py

      - name: Generate Post Content
        run: uv run python auto_generate_post.py

      - name: Validate & Schedule Post Live
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
        run: |
          uv run python run_pipeline.py --image-url "https://raw.githubusercontent.com/anshuraj008/Automated-Pipeline/main/sample-outputs/linkedin-infographic-20260612.png" --target both --live
